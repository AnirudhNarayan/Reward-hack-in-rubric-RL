[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "rrh"
version = "0.1.0"
description = "Replications of 'Reward Hacking in Rubric-Based RL' (arXiv:2605.12474) and RP-OPD from 'OPD Before RL' (arXiv:2610.02781)"
requires-python = ">=3.10"
dependencies = [
  "openai>=1.60",
  "anthropic>=0.40",
  "pyyaml",
  "numpy",
  "scipy",
  "pandas",
  "pyarrow",
  "datasets",
  "matplotlib",
  "tqdm",
]

[project.optional-dependencies]
# GPU-side extras; verl pins its own torch/vllm, so install those per scripts/setup_env.sh.
gpu = ["vllm", "transformers>=4.45", "safetensors", "huggingface_hub"]
dev = ["pytest", "transformers>=4.45", "safetensors", "torch"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
